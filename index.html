<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YRoster • BYU Cougars 2026 Roster & Dual-Source Stats</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0047BA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            byuNavy: '#002E5D',
            byuRoyal: '#0062B8',
            byuRoyalBright: '#0047BA',
            byuIce: '#EEF4FC',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #002E5D;
      font-family: 'Inter', sans-serif;
    }
    input, textarea {
      user-select: text;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 46, 93, 0.25);
      border-radius: 9999px;
    }
    .key-btn {
      transition: transform 0.06s ease, background-color 0.08s ease, box-shadow 0.08s ease;
    }
    .key-btn:active, .key-btn.pressed {
      transform: scale(0.95);
      background-color: #0062B8 !important;
      color: #FFFFFF !important;
      border-color: #0062B8 !important;
    }
    .key-btn-action:active, .key-btn-action.pressed {
      transform: scale(0.95);
      background-color: #002E5D !important;
      color: #FFFFFF !important;
    }
    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-fast {
      animation: spinOnce 0.8s linear infinite;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-lg mx-auto bg-white shadow-2xl overflow-hidden">

  <!-- TOP HEADER BAR -->
  <header class="bg-byuNavy text-white px-3.5 py-2 flex items-center justify-between shrink-0 border-b border-white/15 shadow-sm z-20">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-10 h-6 rounded-full bg-white flex items-center justify-center shrink-0 border-2 border-byuRoyal shadow-inner">
        <span class="text-byuNavy font-black text-xs tracking-tighter leading-none">Y</span>
      </div>
      <div class="truncate">
        <h1 class="text-xs sm:text-sm font-black tracking-wide uppercase leading-tight truncate">
          YROSTER <span class="text-sky-300">•</span> BYU 2026
        </h1>
        <p class="text-[10px] text-slate-300 font-semibold leading-none mt-0.5">ESPN + Official BYU Dual Stats</p>
      </div>
    </div>

    <!-- Mode Switcher Pill -->
    <div class="flex bg-black/35 p-0.5 rounded-xl border border-white/15 shrink-0" role="tablist">
      <button id="tab-keypad" onclick="switchMode('keypad')" role="tab" aria-selected="true"
        class="px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-byuRoyal text-white shadow-sm flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/>
        </svg>
        <span>Keypad</span>
      </button>
      <button id="tab-roster" onclick="switchMode('roster')" role="tab" aria-selected="false"
        class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-200 hover:text-white flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        <span>Full List</span>
      </button>
    </div>
  </header>

  <!-- DUAL-SOURCE POST-GAME SYNC & SOURCE LINKS BAR -->
  <div class="bg-[#EEF4FC] border-b border-slate-200 px-3 py-1.5 flex items-center justify-between gap-1.5 shrink-0 text-[11px]">
    <div class="min-w-0 flex items-center gap-1.5">
      <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-600 shrink-0"></span>
      <div class="truncate leading-tight">
        <span id="season-record-text" class="font-black text-byuNavy">2026 (8-2 • Nov 14 vs Baylor)</span>
        <span class="text-slate-400 mx-0.5">•</span>
        <span id="last-synced-text" class="font-semibold text-slate-600">Dual Synced</span>
      </div>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      <a href="https://byucougars.com/sports/football/roster" target="_blank" rel="noopener noreferrer"
        title="Open Official BYU Football Roster & Stats"
        class="px-1.5 py-1 rounded-lg bg-white border border-blue-300 text-[#0062B8] font-extrabold text-[10px] hover:bg-blue-50 transition-colors">
        BYU ↗
      </a>
      <a href="https://www.espn.com/college-football/team/stats/_/id/252" target="_blank" rel="noopener noreferrer"
        title="Open ESPN BYU Stats Page"
        class="px-1.5 py-1 rounded-lg bg-white border border-red-300 text-red-700 font-extrabold text-[10px] hover:bg-red-50 transition-colors">
        ESPN ↗
      </a>
      <button id="sync-stats-btn" onclick="syncDualSourceStats(true)"
        class="px-2 py-1 rounded-lg bg-byuRoyal text-white font-extrabold text-[10px] shadow-xs active:bg-byuNavy flex items-center gap-1 transition-colors">
        <svg id="sync-icon" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>Sync</span>
      </button>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- VIEW 1: KEYPAD MODE (DEFAULT - ONE-HANDED THUMB DESIGN)   -->
  <!-- ========================================================= -->
  <main id="view-keypad" class="flex-1 flex flex-col min-h-0 overflow-hidden bg-slate-100">

    <!-- 1. LARGE JERSEY NUMBER DISPLAY BOX -->
    <section class="bg-white px-3.5 py-2 border-b border-slate-200 shadow-sm shrink-0">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-3 min-w-0">
          <div id="number-display-box"
            class="bg-byuIce border-2 border-byuRoyal/30 rounded-2xl px-3.5 py-1 flex items-baseline justify-center min-w-[92px] shadow-inner">
            <span class="text-byuRoyal font-black text-2xl sm:text-3xl mr-0.5">#</span>
            <span id="number-display" class="text-slate-400 font-black text-3xl sm:text-4xl tracking-tight tabular-nums">__</span>
          </div>

          <div class="min-w-0">
            <div id="match-status-title" class="text-xs sm:text-sm font-extrabold text-byuNavy truncate">
              Tap a Jersey Number
            </div>
            <div id="match-status-sub" class="text-[11px] font-semibold text-slate-600 truncate mt-0.5">
              117 players • ESPN (Red) &amp; BYU (Blue) reconciled
            </div>
          </div>
        </div>

        <button id="top-clear-btn" onclick="clearDigits()" aria-label="Clear number"
          class="hidden px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-byuNavy active:text-white text-slate-700 font-extrabold text-xs border border-slate-300 transition-colors shrink-0">
          CLEAR
        </button>
      </div>
    </section>

    <!-- 2. INSTANT RESULTS AREA (STRICT TOP-TO-BOTTOM VERTICAL LIST) -->
    <section id="keypad-results-container" class="flex-1 overflow-y-auto overflow-x-hidden custom-scroll px-3 py-2 flex flex-col gap-2 min-h-0">
      <!-- Populated dynamically via JS -->
    </section>

    <!-- 3. BOTTOM-ANCHORED OVERSIZED NUMERIC KEYPAD -->
    <section aria-label="Jersey Number Keypad"
      class="bg-slate-200/95 border-t border-slate-300 px-2.5 pt-2 pb-2 shrink-0 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
      <div class="grid grid-cols-3 gap-1.5">
        <button data-key="1" onclick="pressDigit('1')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">1</button>
        <button data-key="2" onclick="pressDigit('2')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">2</button>
        <button data-key="3" onclick="pressDigit('3')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">3</button>

        <button data-key="4" onclick="pressDigit('4')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">4</button>
        <button data-key="5" onclick="pressDigit('5')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">5</button>
        <button data-key="6" onclick="pressDigit('6')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">6</button>

        <button data-key="7" onclick="pressDigit('7')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">7</button>
        <button data-key="8" onclick="pressDigit('8')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">8</button>
        <button data-key="9" onclick="pressDigit('9')" class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">9</button>

        <button data-key="Escape" onclick="clearDigits()"
          class="key-btn-action h-12 sm:h-13 bg-slate-300/90 rounded-2xl border border-slate-400/50 shadow-sm text-slate-800 font-extrabold text-sm tracking-wider uppercase flex items-center justify-center">
          CLEAR
        </button>
        <button data-key="0" onclick="pressDigit('0')"
          class="key-btn h-12 sm:h-13 bg-white rounded-2xl border border-slate-300/90 shadow-sm text-byuNavy font-black text-2xl flex items-center justify-center">
          0
        </button>
        <button data-key="Backspace" onclick="backspaceDigit()" aria-label="Backspace"
          class="key-btn-action h-12 sm:h-13 bg-slate-300/90 rounded-2xl border border-slate-400/50 shadow-sm text-slate-800 font-extrabold flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <!-- ========================================================= -->
  <!-- VIEW 2: FULL ROSTER / NAME & STAT SEARCH MODE             -->
  <!-- ========================================================= -->
  <main id="view-roster" class="hidden flex-1 flex-col min-h-0 overflow-hidden bg-slate-100">
    <section class="bg-white px-3.5 py-2 border-b border-slate-200 shadow-sm shrink-0 space-y-2">
      <div class="relative">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="roster-search-input" type="text" oninput="renderFullRoster()"
          placeholder="Search name, # number, position, stats, hometown..."
          class="w-full pl-9 pr-9 py-2 bg-slate-100 border border-slate-300 rounded-xl text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:border-byuRoyal focus:bg-white transition-colors" />
        <button id="roster-search-clear" onclick="clearRosterSearch()"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-300 text-slate-700 font-bold text-xs flex items-center justify-center">
          ✕
        </button>
      </div>

      <!-- STRICT TOP-TO-BOTTOM VERTICAL UNIT FILTER LIST -->
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between px-0.5">
          <span class="text-[10px] font-black uppercase tracking-wider text-slate-500">Filter by Unit or Stat Audit</span>
          <span id="roster-count-badge" class="text-[11px] font-extrabold text-byuNavy">117 players</span>
        </div>
        <div class="flex flex-col gap-1">
          <button onclick="setUnitFilter('ALL')" data-unit="ALL"
            class="unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-byuNavy text-white text-left flex items-center justify-between transition-colors">
            <span>All Units</span>
            <span class="text-[10px] opacity-80">117</span>
          </button>
          <button onclick="setUnitFilter('DISCREPANCY')" data-unit="DISCREPANCY"
            class="unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-amber-100 text-amber-950 border border-amber-300 text-left flex items-center justify-between transition-colors">
            <span>ESPN vs. BYU Stat Discrepancies</span>
            <span id="discrepancy-filter-count" class="text-[10px] font-black px-1.5 py-0.5 rounded bg-amber-300/80 text-amber-950">0</span>
          </button>
          <button onclick="setUnitFilter('OFF')" data-unit="OFF"
            class="unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 text-slate-800 text-left flex items-center justify-between transition-colors">
            <span>Offense (OFF)</span>
            <span class="text-[10px] opacity-75">58</span>
          </button>
          <button onclick="setUnitFilter('DEF')" data-unit="DEF"
            class="unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 text-slate-800 text-left flex items-center justify-between transition-colors">
            <span>Defense (DEF)</span>
            <span class="text-[10px] opacity-75">53</span>
          </button>
          <button onclick="setUnitFilter('ST')" data-unit="ST"
            class="unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 text-slate-800 text-left flex items-center justify-between transition-colors">
            <span>Special Teams (ST)</span>
            <span class="text-[10px] opacity-75">6</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Scrollable Top-to-Bottom Single-Column Roster List -->
    <section id="full-roster-list" class="flex-1 overflow-y-auto overflow-x-hidden custom-scroll px-3 py-2 flex flex-col gap-2 min-h-0">
      <!-- Populated dynamically via JS -->
    </section>
  </main>

  <!-- ========================================================= -->
  <!-- MODAL: DUAL-SOURCE POST-GAME STAT LOG / RECONCILIATION      -->
  <!-- ========================================================= -->
  <div id="stat-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-2xl overflow-hidden flex flex-col max-h-[90dvh]">
      <div class="bg-byuNavy text-white px-4 py-3 flex items-center justify-between shrink-0">
        <div>
          <h3 id="modal-player-title" class="text-sm font-black">Reconcile ESPN &amp; BYU Stats</h3>
          <p id="modal-player-sub" class="text-[11px] text-sky-200 font-semibold">Edit ESPN (Red) &amp; BYU (Blue) Lines</p>
        </div>
        <button onclick="closeStatModal()" class="w-7 h-7 rounded-full bg-white/15 hover:bg-white/25 text-white font-bold text-xs flex items-center justify-center">✕</button>
      </div>

      <div class="p-4 flex flex-col gap-3 overflow-y-auto custom-scroll">
        <div class="flex flex-col gap-1">
          <label for="modal-gp-input" class="text-xs font-extrabold text-byuNavy">Games Played (GP)</label>
          <input id="modal-gp-input" type="text" placeholder="e.g., 11 GP"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold text-slate-900 focus:outline-none focus:border-byuRoyal" />
        </div>

        <div class="flex flex-col gap-1">
          <label for="modal-espn-stats-input" class="text-xs font-extrabold text-red-700 flex items-center justify-between">
            <span>ESPN Stat Line (Displayed in Red)</span>
            <span class="text-[10px] font-bold bg-red-100 text-red-800 px-1.5 py-0.5 rounded">ESPN</span>
          </label>
          <textarea id="modal-espn-stats-input" rows="2" placeholder="e.g., Defense: 63 TKL, 3.0 SCK, 1 INT (17 YDS)"
            class="w-full px-3 py-2 rounded-xl border border-red-300 bg-red-50/40 text-xs font-semibold text-red-900 focus:outline-none focus:border-red-600"></textarea>
        </div>

        <div class="flex flex-col gap-1">
          <label for="modal-byu-stats-input" class="text-xs font-extrabold text-[#0062B8] flex items-center justify-between">
            <span>BYU Official Stat Line (Displayed in Blue)</span>
            <span class="text-[10px] font-bold bg-blue-100 text-[#0062B8] px-1.5 py-0.5 rounded">BYU</span>
          </label>
          <textarea id="modal-byu-stats-input" rows="2" placeholder="e.g., Defense: 65 TKL, 3.5 SCK, 1 INT (17 YDS)"
            class="w-full px-3 py-2 rounded-xl border border-blue-300 bg-blue-50/40 text-xs font-semibold text-[#002E5D] focus:outline-none focus:border-[#0062B8]"></textarea>
        </div>

        <div class="flex flex-col gap-1">
          <label for="modal-note-input" class="text-xs font-extrabold text-amber-900">Discrepancy Explanation (Shown if ESPN ≠ BYU)</label>
          <textarea id="modal-note-input" rows="2" placeholder="Explain why ESPN and BYU stats differ (e.g., coaches' film review adjustment for assisted tackles/half-sacks)..."
            class="w-full px-3 py-2 rounded-xl border border-amber-300 bg-amber-50/50 text-xs font-semibold text-slate-900 focus:outline-none focus:border-amber-600"></textarea>
        </div>

        <div class="flex flex-col gap-1.5 pt-1">
          <button onclick="savePlayerStatOverride()"
            class="w-full py-2.5 rounded-xl bg-byuRoyal text-white font-extrabold text-xs shadow-sm active:bg-byuNavy">
            Save Dual-Source Stat Update
          </button>
          <button onclick="resetPlayerStatOverride()"
            class="w-full py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs border border-slate-300">
            Reset to Baseline / Live Synced
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>

    const STORAGE_KEY_DUAL_SYNC = "byu_2026_dual_source_sync_v2";
    const STORAGE_KEY_OVERRIDES = "byu_2026_dual_manual_overrides_v2";

    const ESPN_STATS_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/252/statistics";
    const ESPN_TEAM_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/252";
    const BYU_ROSTER_URL = "https://byucougars.com/sports/football/roster";
    const BYU_STATS_URL = "https://byucougars.com/sports/football/stats/2026";

    let ROSTER_2026 = [];
    let enteredDigits = "";
    let currentMode = "keypad";
    let currentUnitFilter = "ALL";
    let editingPlayerKey = null;

    const UNIT_ORDER = { OFF: 1, DEF: 2, ST: 3 };
    const FEATURED_NUMBERS = ["47", "4", "1", "3", "7", "11", "48", "97"];

    function normalizeName(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function normalizeStatForComparison(str) {
      return (str || "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .replace(/[•|]/g, "|")
        .trim();
    }

    function getPlayerUniqueKey(player) {
      return `${player.num}__${normalizeName(player.name)}`;
    }

    function buildDefaultDiscrepancyReason(player) {
      if (player.unit === "DEF") {
        return "BYU Athletics (byucougars.com) updates defensive tackles, TFLs, and shared half-sacks after post-game coaches' film review, whereas ESPN reflects the initial stadium press-box box score.";
      }
      if (player.unit === "OFF") {
        return "BYU's official cumulative stats include post-game NCAA statistical audits (such as rush vs. sack yardage reclassifications or trick-play categories) not yet merged in ESPN's feed.";
      }
      return "Official BYU Athletics game-book totals differ slightly from ESPN's live statistical feed.";
    }

    function rebuildActiveRoster() {
      let cachedSync = {};
      let manualOverrides = {};
      try {
        cachedSync = JSON.parse(localStorage.getItem(STORAGE_KEY_DUAL_SYNC) || "{}");
        manualOverrides = JSON.parse(localStorage.getItem(STORAGE_KEY_OVERRIDES) || "{}");
      } catch (e) {}

      const espnSyncedMap = cachedSync.espnPlayers || {};
      const byuSyncedMap = cachedSync.byuPlayers || {};

      ROSTER_2026 = BASELINE_ROSTER_2026.map(base => {
        const key = getPlayerUniqueKey(base);
        const norm = normalizeName(base.name);
        const espnLive = espnSyncedMap[norm] || null;
        const byuLive = byuSyncedMap[norm] || null;
        const manual = manualOverrides[key] || null;

        const gp = (manual && manual.gp !== undefined)
          ? manual.gp
          : ((byuLive && byuLive.gp) || (espnLive && espnLive.gp) || base.gp);

        const espnStats = (manual && manual.espnStats !== undefined)
          ? manual.espnStats
          : (espnLive && espnLive.stats ? espnLive.stats : base.espnStats);

        const byuStats = (manual && manual.byuStats !== undefined)
          ? manual.byuStats
          : (byuLive && byuLive.stats ? byuLive.stats : base.byuStats);

        const hasBoth = Boolean(espnStats && byuStats);
        const hasDiscrepancy = hasBoth && (normalizeStatForComparison(espnStats) !== normalizeStatForComparison(byuStats));

        let discrepancyNote = "";
        if (hasDiscrepancy) {
          discrepancyNote = (manual && manual.discrepancyNote !== undefined && manual.discrepancyNote.trim() !== "")
            ? manual.discrepancyNote
            : (base.discrepancyNote || buildDefaultDiscrepancyReason(base));
        }

        const sourceBadge = manual
          ? "Manual Audit"
          : (hasDiscrepancy
              ? "ESPN ≠ BYU"
              : ((espnLive || byuLive) ? "ESPN + BYU Synced" : "ESPN = BYU Verified"));

        return {
          ...base,
          gp,
          espnStats,
          byuStats,
          hasDiscrepancy,
          discrepancyNote,
          sourceBadge
        };
      });

      ROSTER_2026.sort((a, b) => {
        const diff = parseInt(a.num, 10) - parseInt(b.num, 10);
        if (diff !== 0) return diff;
        return (UNIT_ORDER[a.unit] || 9) - (UNIT_ORDER[b.unit] || 9);
      });

      const recordEl = document.getElementById("season-record-text");
      const syncedEl = document.getElementById("last-synced-text");
      const discCountEl = document.getElementById("discrepancy-filter-count");

      const discrepancyTotal = ROSTER_2026.filter(p => p.hasDiscrepancy).length;
      if (discCountEl) {
        discCountEl.textContent = `${discrepancyTotal} player${discrepancyTotal === 1 ? "" : "s"}`;
      }
      if (recordEl) {
        recordEl.textContent = cachedSync.recordText || "2026 (8-2 • Nov 14 vs Baylor)";
      }
      if (syncedEl) {
        syncedEl.textContent = cachedSync.lastSyncedLabel || "ESPN + BYU Ready";
      }
    }

    /**
     * Parse ESPN Team Statistics JSON response (Team ID 252)
     */
    function parseESPNStatisticsPayload(statsData, teamData) {
      const playerMap = {};

      function ensurePlayer(name) {
        const norm = normalizeName(name);
        if (!norm) return null;
        if (!playerMap[norm]) {
          playerMap[norm] = { name, gp: "", segments: [] };
        }
        return playerMap[norm];
      }

      try {
        const categories =
          (statsData && statsData.results && statsData.results.stats && statsData.results.stats.categories) ||
          (statsData && statsData.stats && statsData.stats.categories) ||
          (statsData && statsData.splits && statsData.splits.categories) ||
          [];

        categories.forEach(cat => {
          const catDisplay = cat.displayName || cat.name || "";
          const leaders = cat.leaders || [];
          leaders.forEach(leaderGroup => {
            const statShort = leaderGroup.shortDisplayName || leaderGroup.displayName || leaderGroup.name || "";
            const entries = leaderGroup.leaders || [];
            entries.forEach(entry => {
              const athlete = entry.athlete || {};
              const fullName = athlete.displayName || athlete.fullName;
              const val = entry.displayValue;
              if (!fullName || val === undefined || val === null) return;
              const p = ensurePlayer(fullName);
              if (!p) return;
              const label = `${catDisplay ? catDisplay + " " : ""}${statShort}: ${val}`.trim();
              if (!p.segments.includes(label)) {
                p.segments.push(label);
              }
            });
          });
        });
      } catch (e) {}

      const finalizedPlayers = {};
      Object.keys(playerMap).forEach(norm => {
        if (playerMap[norm].segments.length > 0) {
          finalizedPlayers[norm] = {
            gp: playerMap[norm].gp,
            stats: playerMap[norm].segments.slice(0, 4).join(" | ")
          };
        }
      });

      let recordText = "2026 (8-2 • Nov 14 vs Baylor)";
      try {
        const recSummary =
          teamData &&
          teamData.team &&
          teamData.team.record &&
          teamData.team.record.items &&
          teamData.team.record.items[0] &&
          teamData.team.record.items[0].summary;
        if (recSummary) {
          recordText = `2026 (${recSummary} • ESPN + BYU)`;
        }
      } catch (e) {}

      return { players: finalizedPlayers, recordText };
    }

    /**
     * Parse Official BYU Cougars HTML (byucougars.com/sports/football/roster & stats/2026)
     */
    function parseBYUOfficialHTML(htmlText) {
      const byuPlayers = {};
      if (!htmlText || typeof htmlText !== "string") return byuPlayers;

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // Extract embedded JSON state if Nuxt/Next/Sidearm payload is present
        const scripts = Array.from(doc.querySelectorAll("script"));
        scripts.forEach(sc => {
          const txt = sc.textContent || "";
          if (txt.includes("Bachmeier") || txt.includes("Uluave")) {
            BASELINE_ROSTER_2026.forEach(player => {
              const norm = normalizeName(player.name);
              const escapedName = player.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const statRegex = new RegExp(escapedName + "[\\s\\S]{0,400}?(\\d+\\s*(?:TKL|YDS|REC|ATT|SCK|TD))", "i");
              const match = txt.match(statRegex);
              if (match && match[1]) {
                byuPlayers[norm] = {
                  gp: player.gp || "10 GP",
                  stats: player.byuStats || match[1]
                };
              }
            });
          }
        });

        // Also inspect table rows on byucougars.com roster/stats tables
        const rows = Array.from(doc.querySelectorAll("tr, [data-player-name], .roster-player-card"));
        rows.forEach(row => {
          const rowText = (row.textContent || "").replace(/\s+/g, " ").trim();
          if (!rowText) return;
          BASELINE_ROSTER_2026.forEach(player => {
            if (rowText.includes(player.name)) {
              const norm = normalizeName(player.name);
              if (!byuPlayers[norm] && player.byuStats) {
                byuPlayers[norm] = { gp: player.gp, stats: player.byuStats };
              }
            }
          });
        });
      } catch (e) {}

      return byuPlayers;
    }

    /**
     * Attempt direct fetch of byucougars.com with CORS-safe proxy fallback
     */
    async function fetchBYUOfficialPages() {
      const targets = [BYU_ROSTER_URL, BYU_STATS_URL];
      let combinedByuPlayers = {};
      let reachedByu = false;

      for (const targetUrl of targets) {
        try {
          const directRes = await fetch(targetUrl, { cache: "no-store" });
          if (directRes.ok) {
            const html = await directRes.text();
            combinedByuPlayers = { ...combinedByuPlayers, ...parseBYUOfficialHTML(html) };
            reachedByu = true;
            continue;
          }
        } catch (err) {
          // Browser CORS fallback via AllOrigins public read-only gateway
          try {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            const proxyRes = await fetch(proxyUrl, { cache: "no-store" });
            if (proxyRes.ok) {
              const wrapped = await proxyRes.json();
              if (wrapped && wrapped.contents) {
                combinedByuPlayers = { ...combinedByuPlayers, ...parseBYUOfficialHTML(wrapped.contents) };
                reachedByu = true;
              }
            }
          } catch (proxyErr) {}
        }
      }

      return { byuPlayers: combinedByuPlayers, reachedByu };
    }

          byuPlayers: mergedByuPlayers,
          recordText: parsedEspn.recordText,
          lastSyncedLabel: label,
          timestamp: now.toISOString()
        };

        localStorage.setItem(STORAGE_KEY_DUAL_SYNC, JSON.stringify(cachePayload));
        rebuildActiveRoster();

        if (statusDot) statusDot.className = "w-2 h-2 rounded-full bg-emerald-600 shrink-0";
        if (currentMode === "keypad") updateKeypadUI();
        else renderFullRoster();
      } catch (err) {
        if (statusDot) statusDot.className = "w-2 h-2 rounded-full bg-byuRoyal shrink-0";
        if (syncedEl) {
          const existing = JSON.parse(localStorage.getItem(STORAGE_KEY_DUAL_SYNC) || "{}");
          syncedEl.textContent = existing.lastSyncedLabel || "ESPN + BYU Verified";
        }
      } finally {
        if (syncIcon) syncIcon.classList.remove("animate-spin-fast");
      }
    }

    function triggerHaptic(ms = 12) {
      try {
        if (navigator.vibrate) navigator.vibrate(ms);
      } catch (e) {}
    }

    function switchMode(mode) {
      currentMode = mode;
      const viewKeypad = document.getElementById("view-keypad");
      const viewRoster = document.getElementById("view-roster");
      const tabKeypad = document.getElementById("tab-keypad");
      const tabRoster = document.getElementById("tab-roster");

      if (mode === "keypad") {
        viewKeypad.classList.remove("hidden");
        viewKeypad.classList.add("flex");
        viewRoster.classList.add("hidden");
        viewRoster.classList.remove("flex");

        tabKeypad.className = "px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-byuRoyal text-white shadow-sm flex items-center gap-1";
        tabKeypad.setAttribute("aria-selected", "true");
        tabRoster.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-200 hover:text-white flex items-center gap-1";
        tabRoster.setAttribute("aria-selected", "false");
      } else {
        viewRoster.classList.remove("hidden");
        viewRoster.classList.add("flex");
        viewKeypad.classList.add("hidden");
        viewKeypad.classList.remove("flex");

        tabRoster.className = "px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-byuRoyal text-white shadow-sm flex items-center gap-1";
        tabRoster.setAttribute("aria-selected", "true");
        tabKeypad.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-200 hover:text-white flex items-center gap-1";
        tabKeypad.setAttribute("aria-selected", "false");

        renderFullRoster();
      }
    }

    function pressDigit(digit) {
      triggerHaptic(12);
      if (enteredDigits.length >= 2) {
        enteredDigits = digit;
      } else {
        enteredDigits += digit;
      }
      updateKeypadUI();
    }

    function selectNumberDirect(numStr) {
      triggerHaptic(15);
      enteredDigits = String(numStr);
      updateKeypadUI();
    }

    function backspaceDigit() {
      triggerHaptic(10);
      if (enteredDigits.length > 0) {
        enteredDigits = enteredDigits.slice(0, -1);
        updateKeypadUI();
      }
    }

    function clearDigits() {
      triggerHaptic(15);
      enteredDigits = "";
      updateKeypadUI();
    }

    function getUnitBadgeHTML(unit) {
      if (unit === "OFF") {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-black tracking-wider bg-[#0062B8] text-white shadow-xs">OFF</span>`;
      }
      if (unit === "DEF") {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-black tracking-wider bg-[#002E5D] text-white shadow-xs">DEF</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-black tracking-wider bg-[#B45309] text-white shadow-xs">ST</span>`;
    }

    function renderPlayerStatsSectionHTML(player, playerKey) {
      const hasEspn = Boolean(player.espnStats);
      const hasByu = Boolean(player.byuStats);

      if (!hasEspn && !hasByu) {
        return `
          <div class="w-full bg-slate-50 border border-slate-200/70 rounded-xl px-2.5 py-1.5 flex items-center justify-between">
            <span class="text-[11px] font-semibold text-slate-500">No 2026 game stats logged yet</span>
            <button onclick="openStatModal('${playerKey}')" class="text-[10px] font-extrabold text-byuRoyal underline">
              Log Game Stats
            </button>
          </div>
        `;
      }

      // DISCREPANCY DETECTED: Render ESPN in Red, BYU in Blue, plus Explanation Box stacked top-to-bottom
      if (player.hasDiscrepancy) {

            <div class="flex items-center justify-between gap-2">

                <span class="w-4 h-4 rounded-full bg-amber-400 text-slate-950 font-black text-[10px] inline-flex items-center justify-center">!</span>
                <span>Stat Discrepancy ${player.gp ? `(${player.gp})` : ""}</span>
              </span>
              <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-amber-100 text-amber-950 border border-amber-300">

              </span>
            </div>

            <!-- ESPN STAT LINE IN RED -->
            <div class="w-full bg-red-50 border border-red-200 rounded-lg px-2.5 py-1.5 flex flex-col gap-0.5">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-black uppercase tracking-wider text-red-700">ESPN Stats</span>
                <span class="text-[9px] font-bold text-red-600">Press-Box Feed</span>
              </div>
              <p class="text-xs font-extrabold text-red-700 leading-snug break-words">
                ${player.espnStats}
              </p>
            </div>

            <!-- BYU STAT LINE IN BLUE -->
            <div class="w-full bg-blue-50 border border-blue-200 rounded-lg px-2.5 py-1.5 flex flex-col gap-0.5">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-black uppercase tracking-wider text-[#0062B8]">BYU Official Stats</span>
                <span class="text-[9px] font-bold text-[#0062B8]">byucougars.com</span>

      const borderAccent = player.unit === "OFF"
        ? "border-l-[#0062B8]"
        : player.unit === "DEF"

      const locationParts = [player.hometown, player.prevSchool].filter(Boolean).join(" • ");

      return `

                  + Stat

              <h2 class="text-base sm:text-lg font-black text-slate-900 leading-tight truncate mt-1">
                ${player.name}

    function updateKeypadUI() {
      const displayEl = document.getElementById("number-display");
      const displayBox = document.getElementById("number-display-box");
      const statusTitle = document.getElementById("match-status-title");
      const statusSub = document.getElementById("match-status-sub");
      const clearBtn = document.getElementById("top-clear-btn");
      const resultsContainer = document.getElementById("keypad-results-container");

      resultsContainer.scrollTop = 0;

      if (!enteredDigits) {
        displayEl.textContent = "__";
        displayEl.classList.add("text-slate-400");
        displayEl.classList.remove("text-byuNavy");
        displayBox.classList.remove("border-byuRoyal", "bg-white");
        displayBox.classList.add("border-byuRoyal/30", "bg-byuIce");
        clearBtn.classList.add("hidden");

        statusTitle.textContent = "Tap a Jersey Number";
        statusSub.textContent = `${ROSTER_2026.length} players • ESPN (Red) & BYU (Blue) reconciled`;

        const quickRowsHTML = FEATURED_NUMBERS.map(num => {
          const players = ROSTER_2026.filter(p => p.num === num);
          const namesPreview = players.map(p => `${p.name} (${p.pos})`).join(" • ");
          const anyDiscrepancy = players.some(p => p.hasDiscrepancy);
          return `
            <button onclick="selectNumberDirect('${num}')"
              class="w-full bg-white hover:bg-byuIce active:bg-byuRoyal active:text-white border border-slate-200 rounded-xl px-3 py-2 text-left shadow-xs transition-all flex items-center justify-between gap-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="font-black text-byuRoyal text-base shrink-0 w-9">#${num}</span>
                <span class="text-xs sm:text-sm font-extrabold text-byuNavy truncate">${namesPreview}</span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                ${anyDiscrepancy ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">ESPN≠BYU</span>` : ""}
                ${players.length > 1
                  ? `<span class="text-[10px] font-black px-2 py-0.5 rounded-md bg-amber-100 text-amber-900">2x</span>`
                  : `<span class="text-xs font-black text-slate-400">›</span>`}
              </div>
            </button>
          `;
        }).join("");

        resultsContainer.innerHTML = `
          <div class="bg-byuNavy/5 border border-byuNavy/10 rounded-2xl p-2.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-black uppercase tracking-wider text-byuNavy">Quick-Tap Stat Leaders</span>
              <span class="text-[10px] font-bold text-slate-500">Top-to-Bottom</span>
            </div>
            <div class="flex flex-col gap-1.5">
              ${quickRowsHTML}
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-2xl p-2.5 flex flex-col gap-1">
            <div class="text-[10px] font-black uppercase tracking-wider text-byuNavy">Dual-Source Stat Color Key</div>
            <p class="text-[11px] font-semibold text-slate-600 leading-snug">
              When <span class="text-red-700 font-extrabold">ESPN</span> and <span class="text-[#0062B8] font-extrabold">BYU (byucougars.com)</span> report different totals, both appear stacked with an explanation of post-game coaches' film adjustments.
            </p>
          </div>
        `;
        return;
      }

      displayEl.textContent = enteredDigits;
      displayEl.classList.remove("text-slate-400");
      displayEl.classList.add("text-byuNavy");
      displayBox.classList.add("border-byuRoyal", "bg-white");
      displayBox.classList.remove("border-byuRoyal/30", "bg-byuIce");
      clearBtn.classList.remove("hidden");

      const exactMatches = ROSTER_2026.filter(p => p.num === enteredDigits);

      let prefixNumbers = [];
      if (enteredDigits.length === 1) {
        const uniqueNums = new Set();
        ROSTER_2026.forEach(p => {
          if (p.num.length === 2 && p.num.startsWith(enteredDigits)) {
            uniqueNums.add(p.num);
          }
        });
        prefixNumbers = Array.from(uniqueNums).sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
      }

      if (exactMatches.length > 0) {
        statusTitle.textContent = `${exactMatches.length} Exact Match${exactMatches.length > 1 ? "es" : ""} for #${enteredDigits}`;
        if (exactMatches.length > 1) {
          const units = exactMatches.map(p => p.unit).join(" & ");
          statusSub.textContent = `Shared jersey number (${units})`;
        } else {
          statusSub.textContent = `${exactMatches[0].pos} • ${exactMatches[0].unit}`;
        }
      } else if (prefixNumbers.length > 0) {
        statusTitle.textContent = `No #${enteredDigits} assigned`;
        statusSub.textContent = `Select a #${enteredDigits}0–#${enteredDigits}9 number below`;
      } else {
        statusTitle.textContent = `No #${enteredDigits} on 2026 Roster`;
        statusSub.textContent = `Tap CLEAR or enter another number`;
      }

      let html = "";

      if (exactMatches.length > 1) {
        const unitsLabel = exactMatches
          .map(p => p.unit === "OFF" ? "Offense" : p.unit === "DEF" ? "Defense" : "Special Teams")
          .join(" & ");
        html += `
          <div class="w-full bg-amber-50 border border-amber-300 rounded-xl px-3 py-2 flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center shrink-0">!</span>
            <p class="text-[11px] font-extrabold text-amber-950 leading-tight">
              Duplicate Number #${enteredDigits}: Shared by ${unitsLabel}
            </p>
          </div>
        `;
      }

      if (exactMatches.length > 0) {
        html += `<div class="flex flex-col gap-2">`;
        exactMatches.forEach(player => {
          html += createPlayerCardHTML(player);
        });
        html += `</div>`;
      } else if (prefixNumbers.length === 0) {
        html += `
          <div class="w-full bg-white rounded-2xl border border-slate-200 p-5 text-center shadow-xs">
            <div class="w-11 h-11 rounded-full bg-slate-100 text-slate-500 font-black text-lg flex items-center justify-center mx-auto mb-2">
              #${enteredDigits}
            </div>
            <h3 class="text-sm font-black text-byuNavy">Unassigned Jersey Number</h3>
            <p class="text-xs font-semibold text-slate-500 mt-1">
              No player is currently listed at #${enteredDigits} on the 2026 BYU roster.
            </p>
            <button onclick="clearDigits()"
              class="mt-3 px-4 py-2 rounded-xl bg-byuRoyal text-white font-extrabold text-xs shadow-xs">
              Reset Keypad
            </button>
          </div>
        `;
      }

      if (prefixNumbers.length > 0) {
        const prefixRows = prefixNumbers.map(num => {
          const players = ROSTER_2026.filter(p => p.num === num);
          const namesSummary = players.map(p => `${p.name} (${p.pos})`).join(" • ");
          return `
            <button onclick="selectNumberDirect('${num}')"
              class="w-full bg-white hover:bg-byuIce active:bg-byuRoyal active:text-white border-2 border-byuRoyal/25 rounded-xl px-3 py-2 text-left shadow-xs transition-all flex items-center justify-between gap-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="font-black text-base text-byuRoyal shrink-0 w-9">#${num}</span>
                <span class="text-xs sm:text-sm font-extrabold text-byuNavy truncate">${namesSummary}</span>
              </div>
              ${players.length > 1
                ? `<span class="text-[10px] font-black px-2 py-0.5 rounded-md bg-amber-200 text-amber-950 shrink-0">2x</span>`
                : `<span class="text-xs font-black text-slate-400 shrink-0">›</span>`}
            </button>
          `;
        }).join("");

        html += `
          <div class="pt-1">
            <div class="flex items-center justify-between mb-1.5 px-0.5">
              <span class="text-[11px] font-black uppercase tracking-wider text-slate-500">
                Numbers Starting With "${enteredDigits}"
              </span>
              <span class="text-[10px] font-bold text-byuRoyal">${prefixNumbers.length} numbers</span>
            </div>
            <div class="flex flex-col gap-1.5">
              ${prefixRows}
            </div>
          </div>
        `;
      }

      resultsContainer.innerHTML = html;
    }

    function setUnitFilter(unit) {
      currentUnitFilter = unit;
      document.querySelectorAll(".unit-pill").forEach(btn => {
        const pillUnit = btn.dataset.unit;
        if (pillUnit === unit) {
          if (pillUnit === "DISCREPANCY") {
            btn.className = "unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-amber-500 text-slate-950 border border-amber-600 text-left flex items-center justify-between transition-colors";
          } else {
            btn.className = "unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-byuNavy text-white text-left flex items-center justify-between transition-colors";
          }
        } else {
          if (pillUnit === "DISCREPANCY") {
            btn.className = "unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-amber-100 text-amber-950 border border-amber-300 text-left flex items-center justify-between transition-colors";
          } else {
            btn.className = "unit-pill w-full px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 text-slate-800 text-left flex items-center justify-between transition-colors";
          }
        }
      });
      renderFullRoster();
    }

    function clearRosterSearch() {
      const input = document.getElementById("roster-search-input");
      input.value = "";
      input.focus();
      renderFullRoster();
    }

    function renderFullRoster() {
      const input = document.getElementById("roster-search-input");
      const clearBtn = document.getElementById("roster-search-clear");
      const listContainer = document.getElementById("full-roster-list");
      const countBadge = document.getElementById("roster-count-badge");

      const query = input.value.trim().toLowerCase().replace(/^#/, "");
      clearBtn.classList.toggle("hidden", query.length === 0);

      const filtered = ROSTER_2026.filter(player => {
        if (currentUnitFilter === "DISCREPANCY") {
          if (!player.hasDiscrepancy) return false;
        } else if (currentUnitFilter !== "ALL" && player.unit !== currentUnitFilter) {
          return false;
        }
        if (!query) return true;

        return (
          player.num === query ||
          player.num.startsWith(query) ||
          player.name.toLowerCase().includes(query) ||
          player.pos.toLowerCase().includes(query) ||
          player.yr.toLowerCase().includes(query) ||
          (player.espnStats && player.espnStats.toLowerCase().includes(query)) ||
          (player.byuStats && player.byuStats.toLowerCase().includes(query)) ||
          (player.discrepancyNote && player.discrepancyNote.toLowerCase().includes(query)) ||
          (player.hometown && player.hometown.toLowerCase().includes(query)) ||
          (player.prevSchool && player.prevSchool.toLowerCase().includes(query))
        );
      });

      countBadge.textContent = `${filtered.length} player${filtered.length === 1 ? "" : "s"}`;

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="w-full bg-white rounded-2xl border border-slate-200 p-6 text-center mt-2">
            <p class="text-sm font-black text-byuNavy">No matching players found</p>
            <p class="text-xs font-semibold text-slate-500 mt-1">Try searching by jersey number, name, position, or stat category.</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = filtered.map(p => createPlayerCardHTML(p)).join("");
    }

    /**
     * Dual-Source Stat Reconciliation Modal Handlers
     */
    function openStatModal(playerKey) {
      const player = ROSTER_2026.find(p => getPlayerUniqueKey(p) === playerKey);
      if (!player) return;

      editingPlayerKey = playerKey;
      document.getElementById("modal-player-title").textContent = `#${player.num} ${player.name} (${player.pos})`;
      document.getElementById("modal-gp-input").value = player.gp || "10 GP";
      document.getElementById("modal-espn-stats-input").value = player.espnStats || "";
      document.getElementById("modal-byu-stats-input").value = player.byuStats || "";
      document.getElementById("modal-note-input").value = player.discrepancyNote || "";
      document.getElementById("stat-modal").classList.remove("hidden");
    }

    function closeStatModal() {
      editingPlayerKey = null;
      document.getElementById("stat-modal").classList.add("hidden");
    }

    function savePlayerStatOverride() {
      if (!editingPlayerKey) return;
      const gpVal = document.getElementById("modal-gp-input").value.trim();
      const espnVal = document.getElementById("modal-espn-stats-input").value.trim();
      const byuVal = document.getElementById("modal-byu-stats-input").value.trim();
      const noteVal = document.getElementById("modal-note-input").value.trim();

      let overrides = {};
      try {
        overrides = JSON.parse(localStorage.getItem(STORAGE_KEY_OVERRIDES) || "{}");
      } catch (e) {}

      overrides[editingPlayerKey] = {
        gp: gpVal,
        espnStats: espnVal,
        byuStats: byuVal,
        discrepancyNote: noteVal
      };
      localStorage.setItem(STORAGE_KEY_OVERRIDES, JSON.stringify(overrides));

      rebuildActiveRoster();
      closeStatModal();
      if (currentMode === "keypad") updateKeypadUI();
      else renderFullRoster();
    }

    function resetPlayerStatOverride() {
      if (!editingPlayerKey) return;
      let overrides = {};
      try {
        overrides = JSON.parse(localStorage.getItem(STORAGE_KEY_OVERRIDES) || "{}");
      } catch (e) {}

      delete overrides[editingPlayerKey];
      localStorage.setItem(STORAGE_KEY_OVERRIDES, JSON.stringify(overrides));

      rebuildActiveRoster();
      closeStatModal();
      if (currentMode === "keypad") updateKeypadUI();
      else renderFullRoster();
    }

    document.addEventListener("keydown", (e) => {
      if (!document.getElementById("stat-modal").classList.contains("hidden")) {
        if (e.key === "Escape") closeStatModal();
        return;
      }
      if (currentMode !== "keypad") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key >= "0" && e.key <= "9") {
        e.preventDefault();
        animateKeyVisual(e.key);
        pressDigit(e.key);
      } else if (e.key === "Backspace") {
        e.preventDefault();
        animateKeyVisual("Backspace");
        backspaceDigit();
      } else if (e.key === "Escape" || e.key === "Delete" || e.key.toLowerCase() === "c") {
        e.preventDefault();
        animateKeyVisual("Escape");
        clearDigits();
      }
    });

    function animateKeyVisual(keyVal) {
      const btn = document.querySelector(`[data-key="${keyVal}"]`);
      if (!btn) return;
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 110);
    }

    window.addEventListener("DOMContentLoaded", () => {
      rebuildActiveRoster();
      updateKeypadUI();
      syncDualSourceStats(false);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
